      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
