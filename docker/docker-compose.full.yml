version: "3.9"

# Launches ALL 13 services (1 super + 3 sub orchestrators + 10 model runners)
# in parallel as a single coordinated entity.
#
# Usage:
#   export HUGGINGFACE_API_KEY=hf_...
#   docker compose -f docker/docker-compose.full.yml up --build

x-model-runner-base: &model-runner-base
  build:
    context: ..
    dockerfile: docker/model_runner/Dockerfile
  environment:
    - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
  volumes:
    - ../config:/app/config:ro
  restart: unless-stopped

services:

  # ── Orchestration Layer ───────────────────────────────────────────────────

  super-orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestration/Dockerfile
    ports:
      - "7000:7000"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  code-sub-orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestration/Dockerfile
    command:
      ["uvicorn", "src.orchestration.code_sub_orch:app",
       "--host", "0.0.0.0", "--port", "7100"]
    ports:
      - "7100:7100"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
    depends_on:
      super-orchestrator:
        condition: service_healthy
    restart: unless-stopped

  analysis-sub-orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestration/Dockerfile
    command:
      ["uvicorn", "src.orchestration.analysis_sub_orch:app",
       "--host", "0.0.0.0", "--port", "7200"]
    ports:
      - "7200:7200"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
    depends_on:
      super-orchestrator:
        condition: service_healthy
    restart: unless-stopped

  interface-sub-orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestration/Dockerfile
    command:
      ["uvicorn", "src.orchestration.interface_sub_orch:app",
       "--host", "0.0.0.0", "--port", "7300"]
    ports:
      - "7300:7300"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
    depends_on:
      super-orchestrator:
        condition: service_healthy
    restart: unless-stopped

  # ── Model Runners (Layer 3) ───────────────────────────────────────────────

  code-generation:
    <<: *model-runner-base
    ports:
      - "8001:8001"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - MODEL_ROLE=code_generation
      - MODEL_PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  code-review:
    <<: *model-runner-base
    ports:
      - "8002:8002"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - MODEL_ROLE=code_review
      - MODEL_PORT=8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nl-to-cli:
    <<: *model-runner-base
    ports:
      - "8003:8003"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - MODEL_ROLE=nl_to_cli
      - MODEL_PORT=8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  docs-generator:
    <<: *model-runner-base
    ports:
      - "8004:8004"
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - MODEL_ROLE=docs_generator
      - MODEL_PORT=8004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
